<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | NAQSA Architecture</title><meta name="description" content="Contact NAQSA to discuss your architecture or interior design project.">
<link rel="icon" href="assets/mark-dark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-top="dark"><div id="site-header"></div>

<main><div class="page-hero"><div class="wrap"><h1>Contact</h1><p class="lead">Tell us about your project. We reply within two working days.</p></div></div>
<section><div class="wrap cols"><div class="info"><h2>Studio</h2>
<p>Studio address, City, Country</p><p><a href="mailto:hello@naqsa.com">hello@naqsa.com</a></p><p><a href="tel:+920000000000">+92 000 0000000</a></p><p style="margin-top:1rem;color:var(--taupe-d)">Monday to Saturday, 10am to 6pm</p></div>
<form id="f"><input type="hidden" name="access_key" value="YOUR_WEB3FORMS_KEY"><input type="hidden" name="subject" value="New enquiry from NAQSA website">
<div><label for="n">Name</label><input id="n" name="name" required></div>
<div><label for="e">Email</label><input id="e" name="email" type="email" required></div>
<div><label for="p">Phone</label><input id="p" name="phone" type="tel"></div>
<div><label for="t">Project type</label><select id="t" name="type"><option>Residential</option><option>Interior</option><option>Commercial</option><option>Renovation</option></select></div>
<div><label for="m">About your project</label><textarea id="m" name="message" required></textarea></div>
<button class="btn" type="submit">Send enquiry</button><div id="st" role="status"></div></form></div></section></main>
<div id="site-footer"></div>
<script src="js/main.js"></script></body></html>
